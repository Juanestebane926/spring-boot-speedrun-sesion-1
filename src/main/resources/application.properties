spring.application.name=speedrun-vacantes-sesion-1

# Servidor embebido
server.port=8080

# Base de datos H2 en memoria para el aula
spring.datasource.url=jdbc:h2:mem:vacantesdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate: regenera las tablas limpias al arrancar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Consola visual H2 (accesible en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# DevTools y rendimiento
spring.devtools.livereload.enabled=false
spring.main.banner-mode=off
logging.level.org.springframework=WARN
